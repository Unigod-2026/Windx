# windx production nginx site.
# 由 deploy/deploy.sh 装到 /etc/nginx/sites-available/windx.conf + symlink 到
# sites-enabled/。路径按 git clone 在 /home/ubuntu/projects/Windx 写死 —— 改
# 部署目录要同步改这里。
#
# HTTPS 走自签证书(deploy.sh 第一次跑会生成 /etc/ssl/{certs,private}/windx.*),
# 浏览器会弹「不安全」警告(自签证书的正常表现),点「高级 → 继续前往」即可。
# 上正式域名后换 Let's Encrypt 证书,只改 ssl_certificate / ssl_certificate_key
# 这两行即可。

# HTTP → HTTPS 重定向(自签证书不影响 80,验证用 + 后续 Let's Encrypt challenge)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.windxtech.com windxtech.com;

    # Let's Encrypt 验证 challenge 必须保留 80 通;重定向交由前端处理,
    # 所以这里直接 301 → https。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name www.windxtech.com windxtech.com;

    ssl_certificate     /etc/ssl/certs/windx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/windx-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # 前端静态文件 — 路径对应 deploy.sh 里的 frontend/dist/
    root /home/ubuntu/projects/Windx/frontend/dist;
    index index.html;

    # /healthz 直打后端,deploy.sh 的 smoke check 跟运维都用这个
    location = /healthz {
        proxy_pass http://127.0.0.1:18083/health;
        access_log off;
    }

    # /api/ 反代到 uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:18083/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 前端 SPA fallback —— dev 服务器上的 history 路由(react-router)在
    # 刷新时也要能命中 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资产缓存(尤其 Vite 产出的带 hash 文件名 JS/CSS)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/windx.access.log;
    error_log  /var/log/nginx/windx.error.log warn;
}
