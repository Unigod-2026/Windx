# windx production nginx site — listens on 5173 only.
# 宿主机上 80/443 已被别的服务(已知有 Docker nginx)占用,windx 改走 5173 直出 HTTP。
# 上 HTTPS / 正式域名时,在前面套 Cloudflare 或 Nginx Proxy Manager 做 TLS
# termination,本文件保持纯 HTTP —— 部署脚本不再生成证书。
# 由 deploy/deploy.sh 装到 /etc/nginx/sites-available/windx.conf + symlink 到
# sites-enabled/。路径按 git clone 在 /home/ubuntu/projects/Windx 写死 —— 改
# 部署目录要同步改这里。

server {
    listen 5173 default_server;
    listen [::]:5173 default_server;
    server_name _;

    client_max_body_size 10M;

    # 前端静态文件 — 路径对应 deploy.sh 里的 frontend/dist/
    root /home/ubuntu/projects/Windx/frontend/dist;
    index index.html;

    # /healthz 直打后端,deploy.sh 的 smoke check 跟运维都用这个
    location = /healthz {
        proxy_pass http://127.0.0.1:18083/health;
        access_log off;
    }

    # /api/ 反代到 uvicorn —— 必须用 ^~ 锁住这个 prefix,不让外层
    # `location /` 的 try_files 把 /api/* 当成前端路由 fallback 回 index.html
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18083/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 静态资产缓存(尤其 Vite 产出的带 hash 文件名 JS/CSS)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端 SPA fallback —— dev 服务器上的 history 路由(react-router)在
    # 刷新时也要能命中 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/windx.access.log;
    error_log  /var/log/nginx/windx.error.log warn;
}