# windx 公网入口 —— www.windxtech.com → 127.0.0.1:5173
#
# 拓扑:
#   公网 80/443 ──> nginx ──> 127.0.0.1:5173 ──> uvicorn(FastAPI + frontend/dist)
#
# uvicorn 同时兼前端静态与 API,所以整站 proxy 即可,不用拆 /api 和 /。
# 前端全走相对路径 /api,没有 CORS;登录是 localStorage 里的 Bearer token
# (不是 cookie),所以换域名对前端代码零影响。
#
# 前提:
#   - deploy/start-backend.sh 把 uvicorn 绑在 127.0.0.1;腾讯云安全组同时
#     撤掉 5173 的公网入站。少了这步,任何人都能绕过 HTTPS 直连裸 HTTP。
#   - 腾讯云安全组放通 80/443。
#
# 证书:certbot webroot 模式签发。选 webroot 而不是 `--nginx`,是为了让
# certbot 只写 /etc/letsencrypt/live/...,不回头改本文件 —— 否则服务器上的
# 配置会跟 repo 这份漂移。

server {
    listen 80;
    listen [::]:80;
    server_name www.windxtech.com;

    # ACME HTTP-01 校验。必须留在 80 上且放在 301 之前,否则 certbot
    # 续期时请求会被自己的跳转拦掉,90 天后静默过期。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.18(本机 Ubuntu 22.04)用 listen 参数开 http2;
    # `http2 on;` 指令要 1.25.1+ 才有。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.windxtech.com;

    ssl_certificate     /etc/letsencrypt/live/www.windxtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.windxtech.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # logo 上限 2MB(LOGO_MAX_BYTES),报告发布是 POST,留够余量。
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;

        # uvicorn 起了 --proxy-headers,这四个头决定 FastAPI 看到的
        # client host / scheme / IP;缺了 scheme 会一直是 http。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 报告发布会拉 headless Chromium 渲染整页(约 3-5s),给足余量。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}